# .github/workflows/cd-deploy.yml
name: 2roam v1.1 - Deploy

on:
  workflow_run:
    workflows: [ "2roam v1.1 - Build" ]
    types:
      - completed

  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Définition robuste de l'environnement
    env:
      ENVIRONMENT: ${{ github.event.inputs.environment || 'staging' }}

    environment:
      name: ${{ env.ENVIRONMENT }}
      url: ${{ steps.deploy.outputs.url }}

    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artefacts
        uses: actions/download-artifact@v4
        with:
          path: ./builds

      - name: Deploy to environment
        id: deploy
        run: |
          echo "Deploying to ${ENVIRONMENT}"
          # Commande de déploiement réelle ici
          echo "url=https://2roam-${ENVIRONMENT}.example.com" >> "$GITHUB_OUTPUT"
