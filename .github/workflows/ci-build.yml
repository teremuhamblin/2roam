# .github/workflows/ci-build.yml
name: CI - Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Placeholder build
        run: |
          echo "No build step defined yet."
          mkdir -p dist
          echo "Build placeholder" > dist/build.txt

      - name: Upload placeholder artefact
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist
