# .github/workflows/ci-lint.yml
name: 2roam v1.1 - Lint

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Lint codebase
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        project: [ core, frontend, backend ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        working-directory: ./${{ matrix.project }}
        run: npm ci

      - name: Run linter
        working-directory: ./${{ matrix.project }}
        run: npm run lint
